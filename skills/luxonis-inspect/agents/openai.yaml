interface:
  display_name: "Luxonis Inspect"
  short_description: "Inspect a running OAK pipeline"
  default_prompt: "Use $luxonis-inspect to inspect what this running OAK application produces."
dependencies:
  tools:
    - type: "mcp"
      value: "luxonis"
      description: "Current Luxonis documentation and oakctl inspect guidance"
      transport: "streamable_http"
      url: "https://mcp.luxonis.com/mcp"
policy:
  allow_implicit_invocation: true
