interface:
  display_name: "Luxonis Build"
  short_description: "Build and verify a use-case-specific OAK demo"
  default_prompt: "Use $luxonis-build to build a working OAK proof of concept for my use case."
dependencies:
  tools:
    - type: "mcp"
      value: "luxonis"
      description: "Current Luxonis documentation, examples, and models"
      transport: "streamable_http"
      url: "https://mcp.luxonis.com/mcp"
policy:
  allow_implicit_invocation: true
