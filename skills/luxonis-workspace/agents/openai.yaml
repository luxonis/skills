interface:
  display_name: "Luxonis Workspace"
  short_description: "Bootstrap this folder as a Luxonis agent workspace"
  default_prompt: "Use $luxonis-workspace to make this folder a Luxonis agent workspace."
dependencies:
  tools:
    - type: "mcp"
      value: "luxonis"
      description: "Current Luxonis documentation and oakctl installer guidance"
      transport: "streamable_http"
      url: "https://mcp.luxonis.com/mcp"
policy:
  allow_implicit_invocation: true
