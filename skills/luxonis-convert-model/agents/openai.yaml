interface:
  display_name: "Luxonis Convert Model"
  short_description: "Convert and validate a model for OAK"
  default_prompt: "Use $luxonis-convert-model to convert this approved model for my target OAK."
dependencies:
  tools:
    - type: "mcp"
      value: "luxonis"
      description: "Current Luxonis conversion, model, and target documentation"
      transport: "streamable_http"
      url: "https://mcp.luxonis.com/mcp"
policy:
  allow_implicit_invocation: true
