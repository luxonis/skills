interface:
  display_name: "Luxonis Record"
  short_description: "Capture or replay a holistic OAK recording"
  default_prompt: "Use $luxonis-record to capture or replay a holistic recording of this scene."
dependencies:
  tools:
    - type: "mcp"
      value: "luxonis"
      description: "Current Luxonis record/replay documentation and examples"
      transport: "streamable_http"
      url: "https://mcp.luxonis.com/mcp"
policy:
  allow_implicit_invocation: true
