interface:
  display_name: "Luxonis Integrate Model"
  short_description: "Integrate a validated NN Archive into OAK"
  default_prompt: "Use $luxonis-integrate-model to integrate this validated model into my OAK application."
dependencies:
  tools:
    - type: "mcp"
      value: "luxonis"
      description: "Current Luxonis model integration documentation and examples"
      transport: "streamable_http"
      url: "https://luxonis-mcp.luxonis.workers.dev/mcp"
policy:
  allow_implicit_invocation: true
