interface:
  display_name: "Luxonis App"
  short_description: "Build or change an OAK / DepthAI application"
  default_prompt: "Use $luxonis-app to build or change this OAK application."
dependencies:
  tools:
    - type: "mcp"
      value: "luxonis"
      description: "Current Luxonis documentation, examples, and models"
      transport: "streamable_http"
      url: "https://mcp.luxonis.com/mcp"
policy:
  allow_implicit_invocation: true
