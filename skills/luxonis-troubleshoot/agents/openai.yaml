interface:
  display_name: "Luxonis Troubleshoot"
  short_description: "Diagnose a broken existing OAK application"
  default_prompt: "Use $luxonis-troubleshoot to diagnose and fix this OAK application failure."
dependencies:
  tools:
    - type: "mcp"
      value: "luxonis"
      description: "Current Luxonis documentation and examples"
      transport: "streamable_http"
      url: "https://mcp.luxonis.com/mcp"
policy:
  allow_implicit_invocation: true
